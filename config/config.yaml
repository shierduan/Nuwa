# 女娲AI - 本地开发配置（含飞书集成）
# ⚠️ 请填入你自己的飞书凭据（原配置已泄露，不可使用）
# 使用方法：复制此文件为 config.yaml 并填入真实值

# ========== LLM 配置 ==========
# 自定义测试 API (https://api.kilo.ai/api/gateway)
# 使用提供的 JWT Token 作为 API Key
llm_base_url: "https://api.kilo.ai/api/gateway"
llm_api_key: "REPLACE_WITH_YOUR_KILO_AI_JWT"
llm_model_name: "nvidia/nemotron-3-ultra-550b-a55b:free"  # 可选: kilo-auto, free
llm_temperature: 0.7
llm_max_tokens: 4096

# 备选：本地 LM Studio 模型（免费、无限制，取消注释使用）
# llm_base_url: "http://host.docker.internal:1234/v1"
# llm_api_key: "lm-studio"
# llm_model_name: "local-model"

# ========== 生物节律配置 ==========
energy_recovery_rate: 0.0003
energy_consumption_base: 0.04
energy_consumption_system: 0.005
energy_critical_threshold: 0.05

# ========== 记忆系统配置 ==========
memory_ttl_days: 30
memory_max_retrieval: 5
memory_emotion_weight: 0.3

# ========== 缓存配置 ==========
cache_enabled: true
cache_ttl: 300
cache_vector_maxsize: 5000
cache_response_maxsize: 100
cache_memory_maxsize: 200
cache_state_maxsize: 50

# ========== 内存优化配置 ==========
memory_history_max: 50
memory_warning_mb: 500.0
memory_critical_mb: 1000.0
memory_cleanup_interval: 60.0

# ========== 状态管理配置 ==========
state_save_interval: 30.0
state_file_name: "state.json"

# ========== 梦境系统配置 ==========
dream_interval: 900.0
dream_batch_size: 1000

# ========== 主动对话配置 ==========
active_dialogue_cooldown: 30.0
social_hunger_threshold: 0.6
active_trigger_probability: 0.3

# ========== 人格演化配置 ==========
evolution_cooldown: 21600.0

# ========== 项目路径配置 ==========
project_name: "nuwa"
data_dir: "data"
model_dir: "models"

# ========== 系统配置 ==========
enable_heartbeat: true
enable_debug_mode: false
log_level: "INFO"

# ========== 飞书渠道配置 ==========
# 请在飞书开放平台创建应用获取：https://open.feishu.cn/
channels:
  feishu:
    appId: "cli_a9201497d7385bcd"
    appSecret: "REPLACE_WITH_YOUR_FEISHU_APP_SECRET"
    domain: "feishu"                      # 国内版 feishu，国际版 lark
    enabled: true
    botName: "女娲"                        # 机器人名称（用于识别 @ 消息）
    # 主动消息发送目标（可选，配置后才会主动发送）
    # 格式: chat:xxx 表示群聊, user:xxx 表示私聊
    # 获取方法：在飞书群右键 -> 复制链接 -> 提取 chat_id
    # active_message_target: "chat:oc_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    
  # 钉钉渠道（可选）
  # dingtalk:
  #   appKey: "YOUR_DINGTALK_APP_KEY"
  #   appSecret: "YOUR_DINGTALK_APP_SECRET"
  #   enabled: false

  # 企业微信渠道（可选）
  # wecom:
  #   corpId: "YOUR_WECOM_CORP_ID"
  #   agentId: 1000001
  #   corpSecret: "YOUR_WECOM_CORP_SECRET"
  #   enabled: false