version: '3.8'

services:
  # 后端服务
  backend:
    build: ./backend
    container_name: nuwa-config-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/config:/app/config
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
    environment:
      - CONFIG_PATH=config/config.yaml
      - LOG_LEVEL=INFO
      - HOT_RELOAD=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 前端服务
  frontend:
    build: ./frontend
    container_name: nuwa-config-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8000
    restart: unless-stopped

  # Nginx反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: nuwa-config-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    profiles:
      - proxy

  # Grafana监控（可选）
  grafana:
    image: grafana/grafana:latest
    container_name: nuwa-config-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - ./monitoring/grafana:/var/lib/grafana
    restart: unless-stopped
    profiles:
      - monitoring
