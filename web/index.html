<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuwa - 数字生命</title>
    <link rel="stylesheet" href="style.css">
    <!-- SweetAlert2本地版本 -->
    <script src="node_modules/sweetalert2/dist/sweetalert2.min.js"></script>
    <!-- Pixi & Live2D 本地优先：pixi -> live2dcubismcore -> cubism4 -> pixi-live2d-display(cubism4) -->
    <script src="lib/vendor/pixi-6.5.10.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js';"></script>
    <script src="lib/vendor/live2dcubismcore-4.2.0.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/live2dcubismcore@4.2.0-beta.1/live2dcubismcore.min.js';"></script>
    <script src="node_modules/pixi-live2d-display/dist/cubism4.min.js" onerror="this.onerror=null;this.src='lib/vendor/cubism4.min.js';"></script>
    <script src="node_modules/pixi-live2d-display/dist/index.min.js" onerror="this.onerror=null;this.src='lib/vendor/pixi-live2d-display.min.js';"></script>
    
    <!-- 启动管理器样式 -->
    <style>
        .launcher-btn {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 9999;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .launcher-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .connection-status {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e53e3e;
        }
        
        .status-dot.connected {
            background: #48bb78;
            animation: pulse 2s infinite;
        }
        
        .status-dot.connecting {
            background: #ed8936;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .server-warning {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(229, 62, 62, 0.95);
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            z-index: 10000;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 400px;
        }
        
        .server-warning h3 {
            margin-bottom: 10px;
        }
        
        .server-warning button {
            margin-top: 15px;
            padding: 8px 20px;
            background: white;
            color: #e53e3e;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- 启动管理器按钮 -->
    <button class="launcher-btn" onclick="openLauncher()" title="打开启动管理器">
        🚀 启动管理器
    </button>
    
    <!-- 连接状态指示器 -->
    <div class="connection-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">未连接</span>
    </div>
    
    <!-- TTS状态显示 -->
    <div id="tts-status-display" class="connection-status" style="top: 50px; background: rgba(0,0,0,0.7); display: none;">
        <span id="tts-status-text">TTS: 关闭</span>
    </div>
    
    <!-- Canvas容器 -->
    <div id="canvas-container"></div>
    
    <!-- 右侧控制按钮 -->
    <div class="control-buttons">
        <button id="settings-btn" class="control-btn" title="设置">
            <span class="control-icon">⚙️</span>
        </button>
        <button id="panel-btn" class="control-btn" title="面板">
            <span class="control-icon">📊</span>
        </button>
        <button id="lock-btn" class="control-btn" title="锁定">
            <span class="control-icon">🔒</span>
        </button>
    </div>
    
    <!-- 隐藏的设置菜单 -->
    <div id="settings-menu" class="settings-menu">
        <div class="settings-content">
            <h3>设置</h3>
            
            <!-- API配置管理 -->
            <div class="setting-item" style="border-top: 2px solid rgba(255,255,255,0.3); padding-top: 15px; margin-top: 10px;">
                <label style="font-weight: bold; margin-bottom: 10px; display: block;">🔌 API配置管理</label>
                <div style="margin-bottom: 10px;">
                    <select id="api-config-select" style="width: 100%; padding: 8px 12px; background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 6px; color: white; font-size: 14px; outline: none;">
                        <option value="">-- 选择配置 --</option>
                    </select>
                </div>
                <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                    <button id="add-api-config" class="btn-small" style="flex: 1; background: #48bb78;">添加</button>
                    <button id="delete-api-config" class="btn-small" style="flex: 1; background: #e53e3e;">删除</button>
                    <button id="edit-api-config" class="btn-small" style="flex: 1; background: #4299e1;">编辑</button>
                </div>
                <div id="api-config-details" style="display: none; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px; margin-top: 5px;">
                    <div style="margin-bottom: 8px;">
                        <label style="font-size: 12px;">配置名称</label>
                        <input type="text" id="api-name" placeholder="例如: 本地LM Studio" style="width: 100%; padding: 6px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: white;">
                    </div>
                    <div style="margin-bottom: 8px;">
                        <label style="font-size: 12px;">WebSocket地址</label>
                        <input type="text" id="api-ws-url" placeholder="ws://127.0.0.1:8766" style="width: 100%; padding: 6px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: white;">
                    </div>
                    <div style="margin-bottom: 8px;">
                        <label style="font-size: 12px;">LLM API地址 (可选)</label>
                        <input type="text" id="api-llm-url" placeholder="http://127.0.0.1:1234/v1" style="width: 100%; padding: 6px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: white;">
                    </div>
                    <div style="margin-bottom: 8px;">
                        <label style="font-size: 12px;">API密钥</label>
                        <input type="password" id="api-key" placeholder="lm-studio" style="width: 100%; padding: 6px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: white;">
                    </div>
                    <div style="margin-bottom: 8px;">
                        <label style="font-size: 12px;">模型名称/ID (可手动输入)</label>
                        <input type="text" id="api-model" placeholder="local-model 或 model-id-123" style="width: 100%; padding: 6px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: white;">
                    </div>
                    <div style="margin-bottom: 8px;">
                        <label style="font-size: 12px;">描述</label>
                        <input type="text" id="api-description" placeholder="可选描述" style="width: 100%; padding: 6px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: white;">
                    </div>
                    <div style="display: flex; gap: 5px; margin-top: 10px;">
                        <button id="save-api-config" style="flex: 1; background: #48bb78; color: white; border: none; padding: 6px; border-radius: 4px; cursor: pointer;">保存配置</button>
                        <button id="test-api-connection" style="flex: 1; background: #4299e1; color: white; border: none; padding: 6px; border-radius: 4px; cursor: pointer;">测试连接</button>
                        <button id="cancel-api-edit" style="flex: 1; background: #718096; color: white; border: none; padding: 6px; border-radius: 4px; cursor: pointer;">取消</button>
                    </div>
                    <div id="connection-test-result" style="display: none; margin-top: 8px; padding: 8px; border-radius: 4px; font-size: 12px;"></div>
                </div>
                <div style="margin-top: 8px; font-size: 11px; opacity: 0.8;">
                    💡 当前配置: <span id="current-api-name" style="font-weight: bold;">未选择</span>
                </div>
            </div>
            
            <div class="setting-item">
                <label for="backend-url">后端URL (WebSocket)</label>
                <input type="text" id="backend-url" value="ws://127.0.0.1:8766" placeholder="ws://127.0.0.1:8766">
            </div>
            <div class="setting-item">
                <label for="model-select">选择模型</label>
                <select id="model-select" style="width: 100%; padding: 8px 12px; background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 6px; color: white; font-size: 14px; outline: none;">
                    <option value="openSource">openSource</option>
                </select>
            </div>
            <div class="setting-item">
                <label for="model-scale">模型缩放: <span id="scale-value">1.0</span></label>
                <input type="range" id="model-scale" min="0.05" max="2.0" step="0.0125" value="1.0">
            </div>
            <div class="setting-item electron-only">
                <label for="window-width">窗口宽度: <span id="width-value">800</span>px</label>
                <input type="range" id="window-width" min="400" max="1920" step="10" value="800">
            </div>
            <div class="setting-item electron-only">
                <label for="window-height">窗口高度: <span id="height-value">600</span>px</label>
                <input type="range" id="window-height" min="300" max="1080" step="10" value="600">
            </div>
            <div class="setting-item">
                <label for="volume">音量: <span id="volume-value">50</span>%</label>
                <input type="range" id="volume" min="0" max="100" step="5" value="50">
            </div>
            <!-- Live2D显示设置 -->
            <div class="setting-item">
                <label style="font-weight: bold; margin-bottom: 10px; display: block;">Live2D显示</label>
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
                    <label for="live2d-enabled">启用Live2D</label>
                    <input type="checkbox" id="live2d-enabled">
                    <span id="live2d-status" style="font-size: 12px; color: #666;">未初始化</span>
                </div>
                <div style="margin-top: 8px;">
                    <button id="toggle-live2d" style="width: 100%; background: #4299e1;">切换Live2D显示</button>
                </div>
            </div>
            
            <!-- TTS语音合成设置 -->
            <div class="setting-item">
                <label style="font-weight: bold; margin-bottom: 10px; display: block;">语音合成 (TTS)</label>
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
                    <label for="tts-enabled">启用TTS</label>
                    <input type="checkbox" id="tts-enabled">
                    <span id="tts-status" style="font-size: 12px; color: #666;">未初始化</span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <label for="tts-model">TTS模型:</label>
                    <select id="tts-model" style="width: 100%; padding: 5px;">
                        <option value="facebook/mms-tts-chinese">MMS中文 (默认)</option>
                        <option value="facebook/mms-tts-eng">MMS英文</option>
                        <option value="custom-model-1">自定义模型1</option>
                        <option value="custom-model-2">自定义模型2</option>
                    </select>
                </div>
                <div style="margin-top: 8px;">
                    <button id="test-tts" style="width: 100%; background: #4299e1;">测试TTS</button>
                </div>
                <div id="tts-feedback" style="margin-top: 5px; font-size: 12px; color: #666;"></div>
            </div>
            <!-- 表情按钮配置 -->
            <div class="setting-item">
                <label style="font-weight: bold; margin-bottom: 10px; display: block;">表情按钮配置</label>
                <div id="expression-configs" class="expression-configs">
                    <!-- 动态生成8个表情配置项 -->
                </div>
            </div>
            <div class="setting-item">
                <label for="debug-mode">调试模式</label>
                <input type="checkbox" id="debug-mode">
            </div>
            <!-- Electron特有设置 -->
            <div class="setting-item electron-only">
                <label for="always-on-top">窗口置顶</label>
                <input type="checkbox" id="always-on-top" checked>
            </div>
            <div class="setting-item electron-only">
                <label for="mouse-through">鼠标穿透</label>
                <input type="checkbox" id="mouse-through">
            </div>
            <div class="setting-item electron-only">
                <label for="show-taskbar">显示在任务栏</label>
                <input type="checkbox" id="show-taskbar" checked>
            </div>
            <div class="setting-actions">
                <button id="apply-api-config" style="background: #48bb78; margin-bottom: 10px; width: 100%;">应用当前API配置</button>
                <button id="save-settings">保存</button>
                <button id="close-settings">关闭</button>
            </div>
        </div>
    </div>
    
    <!-- 调试日志 -->
    <div id="debug-logs" class="debug-logs"></div>
    
    <!-- 对话气泡 -->
    <div id="speech-bubble" class="speech-bubble"></div>
    
    <!-- Chat Trigger Button -->
    <button id="chat-trigger" class="chat-trigger">
        <span class="chat-trigger-icon">💬</span>
    </button>
    
    <!-- Expression Buttons -->
    <div id="expression-buttons" class="expression-buttons">
        <button class="expression-btn" data-index="0" title="点击设置">表情1</button>
        <button class="expression-btn" data-index="1" title="点击设置">表情2</button>
        <button class="expression-btn" data-index="2" title="点击设置">表情3</button>
        <button class="expression-btn" data-index="3" title="点击设置">表情4</button>
        <button class="expression-btn" data-index="4" title="点击设置">表情5</button>
        <button class="expression-btn" data-index="5" title="点击设置">表情6</button>
        <button class="expression-btn" data-index="6" title="点击设置">表情7</button>
        <button class="expression-btn" data-index="7" title="点击设置">表情8</button>
    </div>
    
    <!-- Floating Input Bar -->
    <div id="floating-input" class="floating-input">
        <input type="text" id="message-input" placeholder="输入消息..." autocomplete="off">
    </div>
    
    <!-- Bio-Monitor HUD -->
    <div id="bio-monitor" class="bio-monitor">
        <div class="bio-header">
            <span class="bio-title">生理监控</span>
        </div>
        <div class="bio-stats">
            <div class="stat-item">
                <label>精力</label>
                <div class="stat-bar-container">
                    <div id="energy-bar" class="stat-bar energy"></div>
                    <span id="energy-value" class="stat-value">0.0</span>
                </div>
            </div>
            <div class="stat-item">
                <label>混乱度</label>
                <div class="stat-bar-container">
                    <div id="entropy-bar" class="stat-bar entropy"></div>
                    <span id="entropy-value" class="stat-value">0.0</span>
                </div>
            </div>
            <div class="stat-item">
                <label>社交饥渴</label>
                <div class="stat-bar-container">
                    <div id="hunger-bar" class="stat-bar hunger"></div>
                    <span id="hunger-value" class="stat-value">0.0</span>
                </div>
            </div>
            <div class="stat-item">
                <label>好奇心</label>
                <div class="stat-bar-container">
                    <div id="curiosity-bar" class="stat-bar curiosity"></div>
                    <span id="curiosity-value" class="stat-value">0.0</span>
                </div>
            </div>
            <div class="stat-item">
                <label>亲密度</label>
                <div class="stat-bar-container">
                    <div id="intimacy-bar" class="stat-bar intimacy"></div>
                    <span id="intimacy-value" class="stat-value">0.0</span>
                </div>
            </div>
            <div class="stat-item">
                <label>快乐</label>
                <div class="stat-bar-container">
                    <div id="joy-bar" class="stat-bar joy"></div>
                    <span id="joy-value" class="stat-value">0.0</span>
                </div>
            </div>
            <div class="stat-item">
                <label>愤怒</label>
                <div class="stat-bar-container">
                    <div id="anger-bar" class="stat-bar anger"></div>
                    <span id="anger-value" class="stat-value">0.0</span>
                </div>
            </div>
            <div class="stat-item">
                <label>悲伤</label>
                <div class="stat-bar-container">
                    <div id="sadness-bar" class="stat-bar sadness"></div>
                    <span id="sadness-value" class="stat-value">0.0</span>
                </div>
            </div>
            <div class="stat-item">
                <label>恐惧</label>
                <div class="stat-bar-container">
                    <div id="fear-bar" class="stat-bar fear"></div>
                    <span id="fear-value" class="stat-value">0.0</span>
                </div>
            </div>
            <div class="stat-item">
                <label>信任</label>
                <div class="stat-bar-container">
                    <div id="trust-bar" class="stat-bar trust"></div>
                    <span id="trust-value" class="stat-value">0.0</span>
                </div>
            </div>
            <div class="stat-item">
                <label>期待</label>
                <div class="stat-bar-container">
                    <div id="expectation-bar" class="stat-bar expectation"></div>
                    <span id="anticipation-value" class="stat-value">0.0</span>
                </div>
            </div>
            <div class="stat-item">
                <label>厌恶</label>
                <div class="stat-bar-container">
                    <div id="disgust-bar" class="stat-bar disgust"></div>
                    <span id="disgust-value" class="stat-value">0.0</span>
                </div>
            </div>
            <div class="stat-item">
                <label>惊讶</label>
                <div class="stat-bar-container">
                    <div id="surprise-bar" class="stat-bar surprise"></div>
                    <span id="surprise-value" class="stat-value">0.0</span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="main.js"></script>
    <script>
        // 在页面加载完成后自动打开开发者工具（仅用于调试）
        window.addEventListener('load', () => {
            if (typeof window !== 'undefined' && window.process && window.process.type) {
                // 在Electron环境中
                try {
                    const { remote } = require('electron');
                    if (remote && remote.getCurrentWindow) {
                        remote.getCurrentWindow().webContents.openDevTools();
                    } else {
                        console.log('remote模块不可用，无法自动打开开发者工具');
                    }
                } catch (error) {
                    console.log('无法打开开发者工具:', error.message);
                }
            } else {
                // 在浏览器环境中
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    console.log('在开发环境中，可以按F12打开开发者工具查看详细日志');
                }
            }
        });
    </script>
</body>
</html>
