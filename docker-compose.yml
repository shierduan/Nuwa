# 女娲核心系统 - Docker Compose
# 包含：女娲服务 + 前端管理器 + Prometheus + Grafana

version: '3.8'

services:
  # 女娲核心服务
  nuwa-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nuwa-core
    restart: unless-stopped
    ports:
      - "8000:8000"   # HTTP API
      - "8001:8001"   # WebSocket
      - "8080:8080"   # 监控指标
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./management-scripts/scripts/data/nuwa:/app/management-scripts/scripts/data/nuwa
    environment:
      - PYTHONUNBUFFERED=1
      - NUWA_ENV=production
      - LOG_LEVEL=INFO
    networks:
      - nuwa-network
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8080"
      - "prometheus.path=/metrics"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # 前端管理器后端
  nuwa-frontend-backend:
    build:
      context: ./frontend-manager/backend
    container_name: nuwa-frontend-backend
    restart: unless-stopped
    ports:
      - "8002:8000"   # 前端管理器API
    volumes:
      - ./frontend-manager/backend/config:/app/config
      - ./frontend-manager/backend/logs:/app/logs
      - ./frontend-manager/backend/data:/app/data
    environment:
      - CONFIG_PATH=config/config.yaml
      - LOG_LEVEL=INFO
      - HOT_RELOAD=true
    networks:
      - nuwa-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # 前端管理器前端
  nuwa-frontend:
    build:
      context: ./frontend-manager/frontend
    container_name: nuwa-frontend
    restart: unless-stopped
    ports:
      - "5173:80"   # 前端界面
    environment:
      - VITE_API_URL=http://nuwa-frontend-backend:8000
    networks:
      - nuwa-network
    depends_on:
      - nuwa-frontend-backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

  # Prometheus - 指标收集
  prometheus:
    image: prom/prometheus:latest
    container_name: nuwa-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - nuwa-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 512M

  # Grafana - 可视化监控
  grafana:
    image: grafana/grafana:latest
    container_name: nuwa-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - nuwa-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 512M

  # Node Exporter - 系统监控（可选）
  node-exporter:
    image: prom/node-exporter:latest
    container_name: nuwa-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - nuwa-network
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M

networks:
  nuwa-network:
    driver: bridge

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local